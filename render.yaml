# Sentinel Review — Render Deployment Config
# https://render.com/docs/deploy-blueprint
#
# Deploy with:
#   1. Push this repo to GitHub
#   2. Go to https://dashboard.render.com/blueprints
#   3. Connect your repository
#   4. Render auto-detects this render.yaml
#   5. Set environment variables in the Render dashboard
#
# Prerequisites:
#   - A PostgreSQL 16 instance (Render managed DB or external)
#   - A Redis instance (Render managed Redis or external)
#   - GitHub App credentials (App ID + private key)
#   - LLM API key (Anthropic or OpenAI)

services:
  # Web Service
  - type: web
    name: sentinel-review-web
    env: python
    region: oregon
    plan: starter  # $7/mo — enough for demo/portfolio use
    buildCommand: |
      pip install -r requirements.txt
      cd backend && python manage.py collectstatic --noinput
    startCommand: >
      cd backend &&
      python manage.py migrate --noinput &&
      gunicorn sentinel_review.wsgi:application
        --bind 0.0.0.0:$PORT
        --workers 2
        --threads 2
        --timeout 120
        --access-logfile -
        --error-logfile -
    healthCheckPath: /
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: sentinel_review.settings
      - key: DJANGO_SECRET_KEY
        generateValue: true  # Render generates a strong random key
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "sentinel-review.onrender.com,localhost"
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-review-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: sentinel-review-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: sentinel-review-redis
          property: connectionString
      - key: WEBHOOK_SECRET
        sync: false  # Must be set manually in dashboard
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY_B64
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-20250514

  # Background Worker
  - type: worker
    name: sentinel-review-worker
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: >
      cd backend &&
      celery -A sentinel_review worker -l info
        -Q reviews,feedback,default
        -c 2
        --without-gossip
        --without-mingle
        --without-heartbeat
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: sentinel_review.settings
      - key: DJANGO_SECRET_KEY
        fromService:
          name: sentinel-review-web
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-review-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: sentinel-review-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: sentinel-review-redis
          property: connectionString
      - key: WEBHOOK_SECRET
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY_B64
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-20250514

# Databases
databases:
  - name: sentinel-review-db
    plan: starter  # $7/mo — 256MB RAM, 1GB disk
    region: oregon
    postgresMajorVersion: 16
    ipAllowList: []  # Only allow Render internal access

# Redis
redis:
  - name: sentinel-review-redis
    plan: starter  # $7/mo — 256MB RAM
    region: oregon
    maxmemoryPolicy: allkeys-lru
