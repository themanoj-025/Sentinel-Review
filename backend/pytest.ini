[pytest]
DJANGO_SETTINGS_MODULE = sentinel_review.settings
python_files = tests.py test_*.py
testpaths = tests
norecursedirs = .git __pycache__ .env venv
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    db: marks tests that need database access
    slow: marks tests as slow-running
    integration: marks tests as integration tests (might need network/external services)
    unit: marks tests as pure unit tests
