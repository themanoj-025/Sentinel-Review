<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sentinel Review{% endblock %}</title>

    <!-- Compiled Tailwind CSS (purged, ~17KB) -->
    <link rel="stylesheet" href="/static/css/output.css">

    <!-- Bundled HTMX + Alpine.js (~60KB, minified) -->
    <script src="/static/js/bundle.js" defer></script>

    <!-- Alpine.js loading fallback -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof Alpine === 'undefined') {
                document.getElementById('alpine-fallback')?.classList.remove('hidden');
            }
        });
    </script>
</head>
<body class="h-full bg-gray-950 text-gray-100" role="document">
    <div class="min-h-full">
        <!-- Skip-to-content link (accessibility) -->
        <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:px-4 focus:py-2 focus:bg-sentinel-600 focus:text-white focus:rounded-lg focus:outline-none">
            Skip to main content
        </a>

        <!-- Navigation -->
        <nav class="border-b border-gray-800 bg-gray-900/80 backdrop-blur-sm" aria-label="Main navigation">
            <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
                <div class="flex h-16 items-center justify-between">
                    <div class="flex items-center space-x-8">
                        <a href="{% url 'dashboard-home' %}" class="flex items-center space-x-2" aria-label="Sentinel Review Dashboard Home">
                            <span class="text-2xl" aria-hidden="true">🛡️</span>
                            <span class="text-xl font-bold text-white">Sentinel Review</span>
                        </a>
                        <div class="hidden md:flex space-x-1" role="menubar">
                            <a href="{% url 'dashboard-home' %}" role="menuitem" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-800 transition-colors focus:outline-none focus:ring-2 focus:ring-sentinel-500">Dashboard</a>
                            <a href="{% url 'repo-list' %}" role="menuitem" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-800 transition-colors focus:outline-none focus:ring-2 focus:ring-sentinel-500">Repositories</a>
                            <a href="{% url 'stats-overview' %}" role="menuitem" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-800 transition-colors focus:outline-none focus:ring-2 focus:ring-sentinel-500">Analytics</a>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span class="text-sm text-gray-500">v1.0.0</span>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Alpine.js fallback warning (hidden by default) -->
        <div id="alpine-fallback" class="hidden bg-amber-900/50 border-b border-amber-700 px-4 py-2 text-amber-200 text-sm text-center" role="alert">
            ⚠️ Interactive features are unavailable — Alpine.js failed to load. Try refreshing the page.
        </div>

        <!-- Global loading indicator for HTMX requests -->
        <div id="global-loading" class="htmx-indicator fixed top-0 left-0 right-0 z-50" aria-hidden="true">
            <div class="h-1 bg-sentinel-600 animate-pulse"></div>
        </div>

        <!-- Main Content -->
        <main id="main-content" tabindex="-1">
            <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
