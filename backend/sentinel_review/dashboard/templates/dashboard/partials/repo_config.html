<div id="repo-config" class="bg-gray-900 border border-gray-800 rounded-xl p-6">
    <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-white">Review Configuration</h2>
        <span class="text-sm text-green-400 animate-pulse">✓ Saved</span>
    </div>
    <form
        hx-post="{% url 'repo-detail' repo.id %}"
        hx-target="#repo-config"
        hx-swap="outerHTML"
        class="space-y-6"
    >
        <div>
            <label class="text-sm font-medium text-gray-300">Enabled Categories</label>
            <p class="text-xs text-gray-500 mt-1">Select which categories of issues to flag.</p>
            <div class="mt-3 grid grid-cols-2 md:grid-cols-4 gap-3">
                {% for code, label in all_categories %}
                <label class="flex items-center space-x-3 bg-gray-800/50 rounded-lg px-4 py-3 cursor-pointer hover:bg-gray-800 transition-colors">
                    <input
                        type="checkbox"
                        name="enabled_categories"
                        value="{{ code }}"
                        {% if code in repo.enabled_categories %}checked{% endif %}
                        class="rounded border-gray-600 bg-gray-700 text-sentinel-500 focus:ring-sentinel-500"
                    >
                    <span class="text-sm text-gray-300">{{ label }}</span>
                </label>
                {% endfor %}
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label for="max_comments" class="text-sm font-medium text-gray-300">Max Comments per Review</label>
                <input
                    type="number"
                    id="max_comments"
                    name="max_comments"
                    value="{{ repo.max_comments }}"
                    min="1"
                    max="100"
                    class="mt-1 w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-gray-100 focus:outline-none focus:ring-2 focus:ring-sentinel-500"
                >
            </div>
            <div class="flex items-center">
                <label class="flex items-center space-x-3 cursor-pointer">
                    <input
                        type="checkbox"
                        name="private_repo_opt_in"
                        {% if repo.private_review_allowed %}checked{% endif %}
                        class="rounded border-gray-600 bg-gray-700 text-sentinel-500 focus:ring-sentinel-500"
                    >
                    <div>
                        <span class="text-sm font-medium text-gray-300">Allow private repo reviews</span>
                        <p class="text-xs text-gray-500">Explicit opt-in required before reviewing private repositories.</p>
                    </div>
                </label>
            </div>
        </div>

        <div class="flex justify-end">
            <button
                type="submit"
                class="px-6 py-2.5 bg-sentinel-600 hover:bg-sentinel-500 text-white rounded-lg font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-sentinel-500"
            >
                Save Configuration
            </button>
        </div>
    </form>
</div>
