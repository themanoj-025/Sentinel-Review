site_name: Sentinel Review
site_description: Automated PR review agent powered by LLMs — Django, Celery, HTMX, and GitHub App integration
repo_url: https://github.com/sentinel-review/sentinel-review
site_url: https://sentinel-review.github.io/
edit_uri: edit/main/docs/
copyright: MIT License

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - toc.follow
    - toc.integrate
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Decisions: decisions.md
  - Evaluation: evaluation-report.md
  - Security: security-notes.md
  - Limitations: limitations.md
  - Demo:
      - Overview: demo/README.md
