# Sentinel Review — GitHub Actions execution mode
#
# A composite action that runs the Sentinel Review pipeline as a CI step.
# Alternative to the webhook-based deployment — use this to review PRs
# without hosting the full Django/Celery/PostgreSQL stack.
#
# Usage:
#   steps:
#     - uses: sentinel-review/sentinel-review/.github/actions/sentinel-review@main
#       with:
#         github-token: ${{ github.token }}
#         anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

name: 'Sentinel Review'
description: 'Autonomous PR review agent — catches bugs, security issues, and logic errors with LLM + static analysis'
author: 'Sentinel Review'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  github-token:
    description: 'GitHub token for API access (use ${{ github.token }})'
    required: true
  anthropic-api-key:
    description: 'Anthropic API key for Claude (omit to use OpenAI)'
    required: false
  openai-api-key:
    description: 'OpenAI API key for GPT-4o (omit to use Anthropic)'
    required: false
  llm-provider:
    description: 'LLM provider to use: "anthropic" (default) or "openai"'
    required: false
    default: 'anthropic'
  max-comments:
    description: 'Maximum number of inline comments to post'
    required: false
    default: '25'
  enabled-categories:
    description: 'Comma-separated list of enabled categories (bug,security,style,suggestion)'
    required: false
    default: 'bug,security,style,suggestion'

outputs:
  report-path:
    description: 'Path to the JSON review report artifact'
    value: ${{ steps.run-review.outputs.report-path }}

runs:
  using: 'composite'
  steps:
    # ── Checkout the PR code (required for diff and file contents) ────
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history needed for accurate git diff against base SHA

    # ── Set up Python ────────────────────────────────────────────────
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    # ── Install dependencies ──────────────────────────────────────────
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --quiet --upgrade pip
        pip install --quiet -r ${{ github.action_path }}/../../../backend/requirements.txt
        # Install the LLM provider-specific package
        if [ "${{ inputs.llm-provider }}" = "anthropic" ]; then
          pip install --quiet anthropic
        else
          pip install --quiet openai
        fi

    # ── Run the review ───────────────────────────────────────────────
    - name: Run Sentinel Review
      id: run-review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        LLM_PROVIDER: ${{ inputs.llm-provider }}
        MAX_COMMENTS: ${{ inputs.max-comments }}
        ENABLED_CATEGORIES: ${{ inputs.enabled-categories }}
        LOG_LEVEL: INFO
      run: |
        python ${{ github.action_path }}/../../../scripts/gha_review.py
        echo "report-path=/tmp/sentinel-review-reports" >> $GITHUB_OUTPUT

    # ── Upload report as artifact ────────────────────────────────────
    - name: Upload review report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: sentinel-review-report
        path: /tmp/sentinel-review-reports/
        retention-days: 30
