name: Load Test

on:
  schedule:
    # Weekly on Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      concurrent:
        description: "Concurrent requests"
        required: false
        default: "20"
      total:
        description: "Total requests"
        required: false
        default: "100"

env:
  PYTHON_VERSION: "3.12"

jobs:
  load-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinel_review
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          pip install -r ../requirements-dev.txt

      - name: Run database migrations
        run: |
          python manage.py migrate --noinput
        env:
          DATABASE_URL: postgres://sentinel:sentinel@localhost:5432/sentinel_review
          DJANGO_SECRET_KEY: ci-load-test-secret-key-not-for-production
          WEBHOOK_SECRET: ci-load-test-secret

      - name: Start Django dev server
        run: |
          python manage.py runserver 0.0.0.0:8000 &
          sleep 3
          curl --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8000/ -o /dev/null -s -w "%{http_code}"
        env:
          DATABASE_URL: postgres://sentinel:sentinel@localhost:5432/sentinel_review
          DJANGO_SECRET_KEY: ci-load-test-secret-key-not-for-production
          WEBHOOK_SECRET: ci-load-test-secret

      - name: Run load test
        run: |
          python ../scripts/load_test.py \
            --url http://localhost:8000/webhooks/github/ \
            --concurrent ${{ github.event.inputs.concurrent || '20' }} \
            --total ${{ github.event.inputs.total || '100' }} \
            --secret "ci-load-test-secret" \
            --timeout 15
        env:
          DATABASE_URL: postgres://sentinel:sentinel@localhost:5432/sentinel_review
          DJANGO_SECRET_KEY: ci-load-test-secret-key-not-for-production
          WEBHOOK_SECRET: ci-load-test-secret

      - name: Extract and report latency percentiles
        run: |
          echo "Load test run completed at $(date -u)"
          echo "Concurrent: ${{ github.event.inputs.concurrent || '20' }}"
          echo "Total: ${{ github.event.inputs.total || '100' }}"
