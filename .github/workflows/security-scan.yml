# Cancel superseded runs of this workflow on the same ref (PR pushes).
# Never cancels on main pushes or scheduled runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege token scope; jobs declaring their own permissions override this.
permissions:
  contents: read

name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly on Monday 02:00 UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Docker image
        run: docker build -t sentinel-review:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner (Docker image)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: sentinel-review:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: /app/staticfiles
          # Known accepted risks — document with date and reason:
          # aquasecurity/trivy-action supports --ignore-unfixed to suppress
          # OS package CVEs without available fixes. Accept only with
          # documented justification per finding.
          #
          # Current suppressions (as of 2026-07-27):
          # - None: all critical/high findings should be triaged
          #
          # To suppress specific CVEs, add:
          # trivyignores: |
          #   CVE-2024-XXXXX  # Reason: not exploitable in runtime context

      - name: Run Trivy vulnerability scanner (Python dependencies)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-report
          path: |
            trivy-results-*.json
            trivy-image-results-*.json
          retention-days: 30
