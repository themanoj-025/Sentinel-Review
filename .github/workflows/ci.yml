name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SETTINGS_MODULE: sentinel_review.settings
  DATABASE_URL: sqlite:///test_db.sqlite3
  WEBHOOK_SECRET: ci-test-secret
  GITHUB_APP_ID: "000000"
  ANTHROPIC_API_KEY: sk-ant-test-not-a-real-key-replace-me
  GITHUB_APP_PRIVATE_KEY_B64: test-base64-not-a-secret-key

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          cache: pip
          python-version: "3.12"

      - name: Run pre-commit hooks
        run: |
          pip install pre-commit
          pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinel_review
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt
          pip install -r ../requirements-dev.txt

      - name: Run lint (ruff)
        run: |
          ruff check --output-format=github .

      - name: Run type check (mypy)
        run: |
          mypy sentinel_review/

      - name: Run tests with pytest
        run: |
          pytest -v --cov=. --cov-report=term --cov-report=xml -x
        env:
          DATABASE_URL: postgres://sentinel:sentinel@localhost:5432/sentinel_review

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: backend/coverage.xml
          fail_ci_if_error: false

  security-audit:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          cache: pip
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  bandit:
    name: Bandit security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          cache: pip
          python-version: '3.12'
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit
        run: bandit -r backend -ll

  hadolint:
    name: Container lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.2.0
        with:
          dockerfile: Dockerfile

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t sentinel-review .

      - name: Verify Docker image exists
        run: docker image inspect sentinel-review

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Semgrep on codebase
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python
        env:
          SEMGREP_APP_TOKEN: ""
        # Pinned to commit SHA for supply-chain security

  # Optional: verify docker-compose up works
  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Start services with docker-compose
        run: |
          docker compose up -d --build
          sleep 10
          docker compose ps

      - name: Check web service health
        run: |
          curl --retry 5 --retry-delay 5 --retry-connrefused http://localhost:8000/ || true

      - name: Tear down
        run: docker compose down -v

  verify-frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Rebuild bundle and check it matches the committed artifact
        working-directory: frontend
        run: |
          npm run build:js
          git diff --exit-code static/js/bundle.js
        # The committed bundle.js is served directly in production and has a
        # pinned SRI integrity hash, so it must never drift from sources.
        # See frontend/static/js/README.md for provenance and the update flow.
