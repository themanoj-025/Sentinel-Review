[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-review"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "G",   # logging-format-interpolation (no f-strings in logger calls)
    "B",   # bugbear
    "BLE", # blind-except
    "SIM", # simplification
    "C4",  # comprehensions
    "RUF", # ruff-specific
    "PLC", # pylint convention
    "PIE", # misc lints
]
ignore = [
    "E501",   # line length (handled by ruff formatter)
    "N999",   # non-public module name
    "UP031",  # printf formatting in worker scripts (intentional)
    "PLC0415", # import-outside-top-level — lazy imports
    "RUF012",  # mutable class default — Django model pattern
    "F821",    # undefined name — false positives from type annotations
    "SIM102",  # collapsible if — readability preference
    "F401",    # unused import — re-export pattern
    "B904",    # raise-without-from — legacy code
    "SIM102",  # collapsible if — readability preference
    "F401",    # unused import — re-export pattern
    "RUF001",  # ambiguous unicode — intentional
    "RUF100",  # unused noqa directives
    "RUF015",  # unnecessary iterable allocation
    "RUF003",  # ambiguous unicode — intentional
    "B017",    # blind exception assert — test pattern
    "E402",    # module-import-not-at-top — intentional
    "SIM117",  # multiple with-statements
    "RUF034",  # positional match
    "PIE810",  # multiple startswith calls
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
addopts = "-m 'not slow' --nomigrations --strict-markers -p no:cacheprovider --cov --cov-fail-under=50"
DJANGO_SETTINGS_MODULE = "sentinel_review.settings"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::UserWarning",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "sentinel_review.settings",
    "sentinel_review.workers.gha_runner",
    "sentinel_review.workers.llm",
    "sentinel_review.workers.cache",
    "sentinel_review.workers.github_client",
    "sentinel_review.workers.pipeline",
    "sentinel_review.api.health",
    "sentinel_review.migrations.*",
]
ignore_errors = true

[tool.coverage.run]
source = ["backend/sentinel_review"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/wsgi.py",
    "*/manage.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
skip_empty = true
