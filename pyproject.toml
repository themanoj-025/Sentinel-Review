[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length (handled by ruff formatter)
    "N999",  # non-public module name
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "sentinel_review.settings"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
addopts = "--nomigrations --strict-markers -p no:cacheprovider"
filterwarnings = [
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["backend/sentinel_review"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/wsgi.py",
    "*/manage.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
skip_empty = true
