[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "G",   # logging-format-interpolation (no f-strings in logger calls)
]
ignore = [
    "E501",  # line length (handled by ruff formatter)
    "N999",  # non-public module name
    "UP031",  # printf formatting in worker scripts (intentional)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "sentinel_review.settings"
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
addopts = "--nomigrations --strict-markers -p no:cacheprovider"
filterwarnings = [
    "ignore::UserWarning",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "sentinel_review.settings",
    "sentinel_review.workers.gha_runner",
    "sentinel_review.workers.llm",
    "sentinel_review.workers.cache",
    "sentinel_review.workers.github_client",
    "sentinel_review.workers.pipeline",
    "sentinel_review.api.health",
    "sentinel_review.migrations.*",
]
ignore_errors = true

[tool.coverage.run]
source = ["backend/sentinel_review"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/wsgi.py",
    "*/manage.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
skip_empty = true
