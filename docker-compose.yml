services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel_review
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel_review"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    # Note: collectstatic is handled by the Docker build. If running outside
    # Docker (python manage.py runserver), run collectstatic manually first.
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn sentinel_review.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 60 --access-logfile -"
    environment:
      # ╔══════════════════════════════════════════════════════════════╗
      # ║  ⚠️  ROTATE BEFORE PRODUCTION DEPLOYMENT                 ║
      # ║                                                             ║
      # ║  The default values below (change-me, change-me-in-        ║
      # ║  production) are INSECURE and must be rotated before any   ║
      # ║  real deployment. Generate secrets using:                   ║
      # ║                                                             ║
      # ║  DJANGO_SECRET_KEY:                                          ║
      # ║    python -c "import secrets; print(secrets.token_urlsafe(64))"  ║
      # ║                                                             ║
      # ║  WEBHOOK_SECRET:                                             ║
      # ║    python -c "import secrets; print(secrets.token_hex(32))"      ║
      # ║                                                             ║
      # ║  FLOWER_USER / FLOWER_PASSWORD: set unique, strong values   ║
      # ║                                                             ║
      # ║  Set all secrets via .env file (gitignored) or CI secrets   ║
      # ╚══════════════════════════════════════════════════════════════╝
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      DATABASE_URL: postgres://sentinel:sentinel@db:5432/sentinel_review
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - ./.secrets:/app/.secrets:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A sentinel_review worker -l info -Q reviews,feedback,default -c 2
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DATABASE_URL: postgres://sentinel:sentinel@db:5432/sentinel_review
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-change-me}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_B64: ${GITHUB_APP_PRIVATE_KEY_B64:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
    volumes:
      - ./backend:/app
      - ./.secrets:/app/.secrets:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    image: mher/flower:2.0
    command: ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555", "--basic-auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-sentinel}"]
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      FLOWER_USER: ${FLOWER_USER:-admin}
      FLOWER_PASSWORD: ${FLOWER_PASSWORD:-sentinel}

volumes:
  postgres_data:
  static_volume:
